<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>06 — Loops</title>
</head>
<body>

  <h1>06 — Loops (ထပ်ခါ ထပ်ခါ လုပ်ခြင်း)</h1>
  <p>ရလဒ်ကို Console မှာ ကြည့်ပါ</p>

  <script>
    // ============================================
    // ၁။ for — အရေအတွက် သိတဲ့အခါ
    // ============================================
    // အစ | အခြေအနေ | တိုးခြင်း
    for (let i = 1; i <= 5; i++) {
      console.log("အကြိမ် " + i);
    }

    // နောက်ပြန် ရေတွက်
    for (let i = 5; i >= 1; i--) {
      console.log(i);
    }

    // ============================================
    // ၂။ while — အခြေအနေ မှန်နေသရွေ့
    // ============================================
    let count = 1;

    while (count <= 3) {
      console.log("while " + count);
      count++;   // ⚠️ မတိုးရင် အဆုံးမဲ့ loop ဖြစ်မယ်
    }

    // ============================================
    // ၃။ do...while — အနည်းဆုံး တစ်ခါ လုပ်မယ်
    // ============================================
    let x = 10;

    do {
      console.log("do while " + x);
      x++;
    } while (x < 5);

    // အခြေအနေ မမှန်ပေမယ့် တစ်ခါ ရပြီး ပြီးသွားတယ်

    // ============================================
    // ၄။ for...of — array ထဲက တန်ဖိုး တစ်ခုချင်း
    // ============================================
    let fruits = ["apple", "banana", "mango"];

    for (let fruit of fruits) {
      console.log(fruit);
    }

    // ============================================
    // ၅။ for...in — object ရဲ့ key တစ်ခုချင်း
    // ============================================
    let student = {
      name: "Aung Aung",
      age: 20,
      city: "Yangon"
    };

    for (let key in student) {
      console.log(key + " : " + student[key]);
    }

    // ============================================
    // ၆။ break နဲ့ continue
    // ============================================
    // break — loop ကို ရပ်
    for (let i = 1; i <= 10; i++) {
      if (i === 4) {
        break;
      }
      console.log("break " + i);   // 1 2 3
    }

    // continue — ဒီတစ်ခါ ကျော်ပြီး ဆက်
    for (let i = 1; i <= 5; i++) {
      if (i === 3) {
        continue;
      }
      console.log("continue " + i);   // 1 2 4 5
    }

    // ============================================
    // ၇။ loop ထဲမှာ ပေါင်းခြင်း
    // ============================================
    let total = 0;

    for (let i = 1; i <= 10; i++) {
      total += i;
    }

    console.log("1 ကနေ 10 အထိ ပေါင်း = " + total);   // 55

    // ============================================
    // ၈။ nested loop — loop ထဲမှာ loop
    // ============================================
    for (let i = 1; i <= 3; i++) {
      for (let j = 1; j <= 3; j++) {
        console.log(i + " x " + j + " = " + i * j);
      }
    }
  </script>

</body>
</html>
