
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Events</title>
</head>
<body>

    <h1>JavaScript Event Example</h1>

    <!-- User က Click လုပ်နိုင်တဲ့ Button -->
    <button id="myButton">Click Me</button>

    <!-- JavaScript ကနေ Message ပြမယ့်နေရာ -->
    <p id="message">Waiting for event...</p>

    <script>
         //Event 
        // Event ဆိုတာ User က Website ပေါ်မှာ တစ်ခုခုလုပ်ဆောင်လိုက်တဲ့အခါ ဖြစ်ပေါ်လာတဲ့ ဖြစ်ရပ် (Action) ကိုဆိုလို 
        // JavaScript မှာ တွေ့ရများတဲ့ Events များ
        // Event	အဓိပ္ပာယ်
        // click	Element ကို Click လုပ်ခြင်း
        // dblclick	နှစ်ချက် Click လုပ်ခြင်း
        // mouseover	Mouse ကို Element ပေါ်တင်ခြင်း
        // mouseout	Mouse ကို Element ပေါ်မှ ဖယ်ခြင်း
        // keydown	Keyboard Key တစ်ခုနှိပ်ခြင်း
        // keyup	Keyboard Key ကို လွှတ်ခြင်း
        // input	Input ထဲမှာ စာရိုက်ခြင်း
        // change	Input Value ပြောင်းလဲခြင်း
        // submit	Form Submit လုပ်ခြင်း
        // load	Page သို့မဟုတ် Resource Load ဖြစ်ခြင်း

        // HTML ထဲက Button ကို ရှာယူခြင်း
        const button = document.getElementById("myButton");

        // HTML ထဲက Paragraph ကို ရှာယူခြင်း
        const message = document.getElementById("message");

        // Button ကို Click လုပ်တဲ့အခါ
        button.onclick = function() {

            // Message ကို ပြောင်းလဲပေးခြင်း
            message.textContent = "Button Click Event ဖြစ်သွားပါပြီ!";

        };

    </script>

</body>
</html>
