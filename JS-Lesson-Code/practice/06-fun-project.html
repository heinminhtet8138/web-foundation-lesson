<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practice 06 — မင်းငါ့ကို ချစ်လား?</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, "Myanmar Text", sans-serif;
      background: linear-gradient(135deg, #ffe4e6, #fecdd3);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    /* ---------- နောက်ခံ နှလုံးသားများ ---------- */
    #hearts {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .heart {
      position: absolute;
      bottom: -40px;
      color: rgba(244, 63, 94, 0.35);
      animation-name: floatUp;
      animation-timing-function: linear;
      animation-fill-mode: forwards;
    }

    @keyframes floatUp {
      0%   { transform: translateY(0) scale(0.4); opacity: 0; }
      15%  { opacity: 1; }
      100% { transform: translateY(-115vh) scale(1.4); opacity: 0; }
    }

    /* ---------- Card ---------- */
    #card {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 26px;
      padding: 36px 28px;
      text-align: center;
      width: min(92vw, 420px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    #card.fade-out {
      opacity: 0;
      transform: scale(0.9);
    }

    .big-heart {
      font-size: 3rem;
      display: inline-block;
      animation: beat 1.1s ease-in-out infinite;
    }

    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.18); }
    }

    #question {
      font-size: 1.7rem;
      color: #1f2937;
      margin: 10px 0 28px;
      transition: opacity 0.3s ease;
    }

    .btn-row {
      display: flex;
      justify-content: center;
      gap: 18px;
      min-height: 56px;
    }

    .love-btn {
      font: inherit;
      font-weight: 700;
      border: 0;
      border-radius: 999px;
      padding: 12px 26px;
      color: #fff;
      cursor: pointer;
    }

    #yes-btn {
      background: #f43f5e;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    #yes-btn:hover { background: #e11d48; }

    #no-btn {
      background: #94a3b8;
      transition: left 0.12s ease, top 0.12s ease;
    }

    /* ---------- အောင်ပွဲ ---------- */
    #success {
      position: absolute;
      z-index: 10;
      text-align: center;
      padding: 20px;
    }

    #success h1 {
      font-size: clamp(1.8rem, 7vw, 3.4rem);
      color: #e11d48;
      margin: 0;
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.06); }
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="hearts"></div>

  <div id="card">
    <div class="big-heart">❤️</div>
    <h1 id="question">မင်းငါ့ကို ချစ်လား?</h1>

    <div class="btn-row">
      <button id="yes-btn" class="love-btn">ချစ်တယ်</button>
      <button id="no-btn" class="love-btn">မချစ်ဘူး</button>
    </div>
  </div>

  <div id="success" class="hidden">
    <h1>💖 မင်းကိုလည်း ငါသိပ်ချစ်တယ် 💖</h1>
  </div>

  <script>
    // ============================================
    // ၁။ Element ရှာ
    // ============================================
    const hearts = document.getElementById("hearts");
    const card = document.getElementById("card");
    const question = document.getElementById("question");
    const yesBtn = document.getElementById("yes-btn");
    const noBtn = document.getElementById("no-btn");
    const success = document.getElementById("success");

    // ============================================
    // ၂။ နှလုံးသား ဆောက်
    // ============================================
    const emojis = ["❤️", "💖", "💝", "💕", "💗"];

    function createHeart() {
      let heart = document.createElement("div");
      heart.className = "heart";

      let index = Math.floor(Math.random() * emojis.length);
      heart.textContent = emojis[index];

      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (Math.random() * 20 + 15) + "px";
      heart.style.animationDuration = (Math.random() * 3 + 4) + "s";

      hearts.append(heart);

      // ⚠️ ဖျက်ဖို့ မေ့ရင် element တွေ စုပုံလာမယ်
      setTimeout(() => heart.remove(), 7000);
    }

    setInterval(createHeart, 400);

    for (let i = 0; i < 8; i++) {
      setTimeout(createHeart, i * 120);
    }

    // ============================================
    // ၃။ "မချစ်ဘူး" — လျှောက်ပြေး
    // ============================================
    function runAway() {
      let rect = noBtn.getBoundingClientRect();

      let maxX = window.innerWidth - rect.width - 20;
      let maxY = window.innerHeight - rect.height - 20;

      let x = Math.random() * Math.max(maxX, 0);
      let y = Math.random() * Math.max(maxY, 0);

      noBtn.style.position = "fixed";
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
      noBtn.style.margin = "0";
      noBtn.style.zIndex = "50";
    }

    noBtn.addEventListener("mouseenter", runAway);
    noBtn.addEventListener("click", runAway);

    noBtn.addEventListener("touchstart", (event) => {
      event.preventDefault();
      runAway();
    }, { passive: false });

    // ============================================
    // ၄။ "ချစ်တယ်" — ကြီးလာပြီး အောင်ပွဲ
    // ============================================
    let clickCount = 0;

    yesBtn.addEventListener("click", () => {
      clickCount++;

      if (clickCount < 5) {
        let scale = 1 + clickCount * 0.6;
        yesBtn.style.transform = `scale(${scale})`;

        if (clickCount >= 2) {
          noBtn.classList.add("hidden");
          question.style.opacity = String(1 - clickCount * 0.15);
        }

        return;
      }

      if (clickCount === 5) {
        yesBtn.style.position = "fixed";
        yesBtn.style.top = "50%";
        yesBtn.style.left = "50%";
        yesBtn.style.transform = "translate(-50%, -50%) scale(5)";
        yesBtn.style.zIndex = "100";

        setTimeout(() => {
          card.classList.add("fade-out");

          setTimeout(() => {
            yesBtn.remove();
            success.classList.remove("hidden");

            for (let i = 0; i < 60; i++) {
              setTimeout(createHeart, i * 40);
            }
          }, 400);
        }, 200);
      }
    });
  </script>

</body>
</html>
