<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practice 03 — ဂဏန်းတွက်စက်</title>

  <style>
    body { font-family: sans-serif; padding: 20px; }
    .calc { width: 260px; }
    .display {
      width: 100%;
      box-sizing: border-box;
      font-size: 28px;
      text-align: right;
      padding: 10px;
      margin-bottom: 8px;
    }
    .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .keys button { padding: 14px 0; font-size: 18px; cursor: pointer; }
    .wide { grid-column: span 2; }
  </style>
</head>
<body>

  <h1>ဂဏန်းတွက်စက်</h1>

  <div class="calc">
    <input id="display" class="display" type="text" value="0" readonly>

    <div class="keys">
      <button data-key="7">7</button>
      <button data-key="8">8</button>
      <button data-key="9">9</button>
      <button data-key="/">÷</button>

      <button data-key="4">4</button>
      <button data-key="5">5</button>
      <button data-key="6">6</button>
      <button data-key="*">×</button>

      <button data-key="1">1</button>
      <button data-key="2">2</button>
      <button data-key="3">3</button>
      <button data-key="-">−</button>

      <button data-key="0">0</button>
      <button data-key=".">.</button>
      <button data-key="=">=</button>
      <button data-key="+">+</button>

      <button id="clear" class="wide">C</button>
      <button id="back" class="wide">⌫</button>
    </div>
  </div>

  <p id="error" style="color:red;"></p>

  <script>
    let display = document.getElementById("display");
    let errorEl = document.getElementById("error");

    // ============================================
    // ၁။ အခြေအနေ
    // ============================================
    let current = "0";      // လက်ရှိ ရိုက်နေတဲ့ ဂဏန်း
    let previous = null;    // အရင်က ဂဏန်း
    let operator = null;    // + - * /
    let justCalculated = false;

    // ============================================
    // ၂။ ပြ
    // ============================================
    function render() {
      display.value = current;
    }

    // ============================================
    // ၃။ ဂဏန်း ထည့်
    // ============================================
    function inputNumber(num) {
      errorEl.textContent = "";

      if (justCalculated) {
        current = "0";
        justCalculated = false;
      }

      if (num === ".") {
        if (current.includes(".")) {
          return;
        }

        current += ".";
        render();
        return;
      }

      if (current === "0") {
        current = num;
      } else {
        current += num;
      }

      render();
    }

    // ============================================
    // ၄။ Operator
    // ============================================
    function inputOperator(op) {
      errorEl.textContent = "";

      // ရှေ့မှာ operator ရှိပြီး ဂဏန်း အသစ် မရိုက်ရသေးရင် လဲ
      if (operator !== null && !justCalculated) {
        calculate();
      }

      previous = Number(current);
      operator = op;
      justCalculated = false;
      current = "0";
    }

    // ============================================
    // ၅။ တွက်
    // ============================================
    function calculate() {
      if (operator === null || previous === null) {
        return;
      }

      let a = previous;
      let b = Number(current);
      let result = 0;

      switch (operator) {
        case "+":
          result = a + b;
          break;
        case "-":
          result = a - b;
          break;
        case "*":
          result = a * b;
          break;
        case "/":
          if (b === 0) {
            errorEl.textContent = "၀ နဲ့ စားလို့ မရဘူး";
            return;
          }
          result = a / b;
          break;
        default:
          return;
      }

      // ဒသမ အများကြီး မပြအောင်
      current = String(Math.round(result * 1e10) / 1e10);

      previous = null;
      operator = null;
      justCalculated = true;

      render();
    }

    // ============================================
    // ၆။ ရှင်း / ဖျက်
    // ============================================
    function clearAll() {
      current = "0";
      previous = null;
      operator = null;
      justCalculated = false;
      errorEl.textContent = "";
      render();
    }

    function backspace() {
      if (justCalculated) {
        clearAll();
        return;
      }

      current = current.slice(0, -1);

      if (current === "" || current === "-") {
        current = "0";
      }

      render();
    }

    // ============================================
    // ၇။ Button တွေ (Delegation)
    // ============================================
    document.querySelector(".keys").addEventListener("click", (event) => {
      let btn = event.target.closest("button");

      if (!btn) {
        return;
      }

      if (btn.id === "clear") {
        clearAll();
        return;
      }

      if (btn.id === "back") {
        backspace();
        return;
      }

      let key = btn.dataset.key;

      if (key === undefined) {
        return;
      }

      handleKey(key);
    });

    function handleKey(key) {
      if ("0123456789.".includes(key)) {
        inputNumber(key);
        return;
      }

      if (["+", "-", "*", "/"].includes(key)) {
        inputOperator(key);
        return;
      }

      if (key === "=") {
        calculate();
      }
    }

    // ============================================
    // ၈။ Keyboard
    // ============================================
    document.addEventListener("keydown", (event) => {
      let key = event.key;

      if ("0123456789.+-*/".includes(key) && key.length === 1) {
        handleKey(key);
        return;
      }

      if (key === "Enter" || key === "=") {
        event.preventDefault();
        calculate();
        return;
      }

      if (key === "Backspace") {
        event.preventDefault();
        backspace();
        return;
      }

      if (key === "Escape") {
        clearAll();
      }
    });

    render();
  </script>

</body>
</html>
